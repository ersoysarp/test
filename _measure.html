<!DOCTYPE html><html><body><div id="out">pending</div>
<iframe id="f" src="/BlueCurrency.html" style="width:1280px;height:760px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.addEventListener('load',()=>{
  setTimeout(()=>{
    const d=f.contentDocument;
    const pages=[...d.querySelectorAll('.stage')];
    const res=[];const small=[];
    pages.forEach((p,idx)=>{
      pages.forEach((q,j)=>q.classList.toggle('active',j===idx));
      res.push('p'+(idx+1)+'='+p.offsetHeight);
      p.querySelectorAll('*').forEach(n=>{
        if(!n.children.length && n.textContent.trim() && !n.closest('.pop')){
          const fs=parseFloat(getComputedStyle(n).fontSize);
          if(fs<14) small.push('p'+(idx+1)+' '+n.className+':'+fs);
        }
      });
    });
    const pops=d.querySelectorAll('.pop').length;
    const empty=[...d.querySelectorAll('[data-v]')].filter(n=>!n.querySelector('.pop')).length;
    pages.forEach((q,j)=>q.classList.toggle('active',j===0));
    document.getElementById('out').textContent=res.join(' ')+' || bubbles built: '+pops
      +' || chips without a bubble: '+empty+' || under14: '+(small.join(' ')||'none');
  },700);
});
</script></body></html>
